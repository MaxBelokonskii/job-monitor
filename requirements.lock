# Лок собран на macOS. Он применяется и на Windows (start_web.bat), поэтому
# пин, который на Windows не ставится, обязан нести маркер окружения, иначе
# `pip install -r requirements.lock` падает целиком и не ставится НИЧЕГО.
# Инвариант закреплён тестом tests/test_dependencies.py: если апстрим
# объявляет зависимость с маркером платформы, лок не имеет права его потерять.
#
# Известные неполные места — три пакета, и все три приезжают на Windows
# НЕзакреплёнными. В локе, снятом на macOS, их нет и появиться оффлайн
# неоткуда; установка от этого не падает — pip доставит их как транзитивные,
# просто версии выберет «на сегодня».
#
#   * colorama — `pytest` объявляет `colorama>=0.4; sys_platform == "win32"`.
#     (Проверено по метаданным окружения: закреплённые здесь `click 8.5.0` и
#     `uvicorn 0.52.4` её НЕ объявляют, хотя более старые версии объявляли.)
#   * cffi — `trio 0.34.0`, которую тянет `selenium`, объявляет
#     `cffi>=1.14; os_name == "nt" and implementation_name != "pypy"`.
#   * pycparser — собственная зависимость cffi, приезжает вместе с ней.
#
# Колёса под cp313/win_amd64 у всех трёх есть, так что установка проходит;
# незакреплённой остаётся именно воспроизводимость лока на Windows, и
# заявлять её шире, чем она есть, нельзя.
