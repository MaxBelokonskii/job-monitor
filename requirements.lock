# Колёс под Windows у uvloop нет и не было (его setup.py прямо бросает
# RuntimeError('uvloop does not support Windows at the moment')). Без маркера
# `pip install -r requirements.lock` на Windows падает на этой строке.
#
# Маркер — дословно апстримный (uvicorn 0.52.4, минус часть про экстру):
# Windows тут не единственная площадка без uvloop, и «отсекает ли Windows» —
# слишком слабое требование. Прежний `sys_platform != "win32"` на Cygwin и на
# PyPy всё ещё пробовал его поставить, то есть ронял установку целиком тем же
# способом, от которого маркер и заводили. Закреплено
# tests/test_dependencies.py::test_a_lock_marker_is_never_wider_than_upstream_allows.
