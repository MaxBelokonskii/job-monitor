# Зачем этот workflow вообще существует.
#
# Разработчик у проекта один, прогон занимает двадцать секунд, и слияния
# делаются руками — сценария «кто-то другой сломал master» здесь нет. CI
# заведён ради одного свойства: **«зелёный» должен значить одно и то же**.
#
# Без Node.js набор пропускает 27 тестов — среди них поведенческие пины
# XSS и CSP — и всё равно рапортует «759 passed». Предупреждение в конце
# прогона об этом говорит, но его легко пролистать. Фиксированное
# окружение снимает вопрос.
#
# Второе: установка с нуля по requirements.lock не проверяется никогда,
# потому что все работают в готовом .venv. Дефект с uvloop без
# платформенного маркера, ломавший документированный запуск под Windows,
# был ровно этого класса.

name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 — нижняя граница requires-python: без неё обещание
        # «>=3.11» в pyproject.toml остаётся непроверенным. 3.13 — то, на
        # чём проект разрабатывается.
        python: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node обязателен, а не желателен
        # Явная проверка вместо надежды на шаг выше: если setup-node
        # однажды уберут или он тихо не сработает, прогон обязан упасть
        # здесь, а не проехать зелёным с 27 пропущенными тестами.
        # Чистый shell: до setup-python ниже полагаться на `python` рано.
        run: command -v node && node --version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Установка с нуля по локу
        run: python -m pip install -e ".[dev]" -r requirements.lock

      - name: Тесты, и ни один не пропущен
        # Обратная сторона проверки Node выше: с ним набор идёт целиком,
        # и пропуск означает, что «зелёный» тише, чем кажется. Появится
        # законный пропуск — придётся объяснить его здесь, а не
        # обнаружить однажды по факту.
        #
        # `pipefail` обязателен: без него код возврата берётся у `tee`, и
        # упавший прогон проезжает зелёным — ровно тот класс молчаливого
        # успеха, ради которого этот workflow и заведён.
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/pytest.out
          if grep -qE '[0-9]+ skipped' /tmp/pytest.out; then
            echo "::error::в прогоне есть пропущенные тесты — набор доказывает меньше, чем показывает"
            exit 1
          fi

      - name: Хуки pre-commit по всему дереву
        # Тот же хук защиты от коммита секретов, что стоит локально: он
        # срабатывает только у того, кто его установил.
        run: pre-commit run --all-files
