repos:
  - repo: local
    hooks:
      - id: check-no-secrets
        name: no secrets, no archives
        entry: scripts/check_no_secrets.py
        language: script
        stages: [pre-commit]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
